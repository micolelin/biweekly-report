<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專案追蹤表</title>
<style>
  :root {
    --bg: #f0f2f5; --fg: #1a1a2e; --card: #ffffff; --muted: #6b7280;
    --line: #e5e7eb; --accent: #1e40af; --danger: #dc2626; --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --fg: #e2e8f0; --card: #1e293b; --muted: #94a3b8;
      --line: #334155; --accent: #60a5fa; --danger: #f87171; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
    /* 底部固定狀態列的高度不是常數：手機窄螢幕按鈕擠不下會換成兩排，
       狀態文字比較長（例如錯誤訊息）也可能換行，猜一個固定值不是猜太小
       （蓋住最後一列）就是猜太大（平白多一截空白）。--bar-h 由下面的
       JS 即時量測 #bar 的實際高度、寫在 <html> 上；var() 的第二個參數
       是 JS 還沒跑到（或極舊瀏覽器不支援 ResizeObserver 又剛好卡在
       resize 事件之間）時的保底值。注意這裡不能寫成
       `body { --bar-h: 5rem }` 再讓 JS 覆寫——body 自己宣告的值一律
       蓋過從 <html> 繼承下來的值，JS 寫在 <html> 上會被吃掉。 */
    padding-bottom: var(--bar-h, 5rem);
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 0.75rem 1rem; position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 1.05rem; font-weight: 700; }
  main { padding: 1rem; max-width: 80rem; margin: 0 auto; }

  table { width: 100%; border-collapse: collapse; background: var(--card); }
  th, td { border: 1px solid var(--line); padding: 0.5rem; vertical-align: top; text-align: left; }
  th { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  textarea {
    width: 100%; border: none; background: transparent; color: inherit;
    font: inherit; resize: none; overflow: hidden; min-height: 2.5rem;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row-tools { width: 3rem; text-align: center; }
  .del {
    background: none; border: none; color: var(--muted);
    font-size: 1.1rem; cursor: pointer; padding: 0.25rem 0.5rem;
  }
  .del:hover { color: var(--danger); }

  /* 手機：四欄文字擠進一個螢幕必然不可讀，改成一列一張卡片 */
  @media (max-width: 40rem) {
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 0.75rem; margin-bottom: 1rem; padding: 0.5rem;
    }
    td { border: none; border-bottom: 1px solid var(--line); padding: 0.5rem 0.25rem; }
    td:last-of-type { border-bottom: none; }
    td::before {
      content: attr(data-label); display: block;
      font-size: 0.75rem; color: var(--muted); font-weight: 600; margin-bottom: 0.25rem;
    }
    .row-tools {
      /* 這個 width: 100% 不是跟上面 `td { width: 100% }` 重複的死碼：
         .row-tools 是 class selector（specificity 0,1,0），永遠贏過
         type selector `td`（0,0,1），跟寫在 @media 裡面或後面完全無關。
         沒有這行，這個 td 會繼續吃外層（非 @media）那條
         `.row-tools { width: 3rem; }`，變成手機版仍然卡在 48px 寬。
         這欄要留寬是因為刪除鍵放大到 44px（見下面 .del），48px 扣掉
         左右 padding 只剩 40px 內容寬，放不下，按鈕會被擠出欄位、
         有機會造成整頁橫向捲動。 */
      width: 100%; text-align: right;
    }
    .del {
      /* 桌機滑鼠點擊精準，26px 高的小圖示夠用；手機用手指戳，離 iOS／
         Android 建議的 44px 最小觸控目標有段距離，容易點不中或點到隔壁。
         這顆按鈕本來就有 confirm() 二次確認擋著，就算不小心點到也不會
         真的刪錯資料，所以這裡選擇「故意做大、寧可不小心碰到也好過點
         不中」，不維持小巧但常常要點兩三次才點到的尺寸。 */
      min-width: 2.75rem; min-height: 2.75rem;
      font-size: 1.3rem;
      display: inline-flex; align-items: center; justify-content: center;
    }
  }

  #bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 0.75rem 1rem;
    /* 有 Home Indicator 手勢列的 iPhone，把底部安全區併進 padding，
       按鈕才不會貼著手勢熱區。這頁目前沒開 viewport-fit=cover，env()
       現況下會落到後面的 0px 備援值（Safari 預設就會把手勢區留在頁面
       外，不需要頁面自己讓開）；先加上是為了不用等到哪天加了
       viewport-fit=cover，或使用者把這頁加到主畫面變成獨立 App 時
       再回頭補。 */
    padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center;
    gap: 0.75rem; flex-wrap: wrap;
  }
  #status { flex: 1; font-size: 0.9rem; color: var(--muted); min-width: 10rem; }
  #status.error { color: var(--danger); }
  #status.saved { color: var(--ok); }
  button.action {
    background: var(--accent); color: #fff; border: none;
    border-radius: 0.5rem; padding: 0.6rem 1rem;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button.action[disabled] { opacity: 0.5; cursor: default; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
</style>
</head>
<body>
<header><h1>專案追蹤表</h1></header>

<main>
  <table>
    <thead>
      <tr>
        <th>Progress</th><th>Insights</th><th>NPI</th><th>Remarks</th><th class="row-tools"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<div id="bar">
  <span id="status">載入中…</span>
  <button class="action ghost" id="add" disabled>＋ 新增一列</button>
  <button class="action" id="save" disabled>儲存</button>
</div>

<script>
const FIELDS = ['progress', 'insights', 'npi', 'remarks'];
const LABELS = { progress: 'Progress', insights: 'Insights', npi: 'NPI', remarks: 'Remarks' };

let rows = [];
let sha = null;
let dirty = false;
let editSeq = 0; // 每次編輯 +1，save() 送出前拍下快照，回應回來時比對有沒有變過
let saving = false; // PUT 還在飛行中；擋住 markDirty() 重新啟用儲存鈕，避免帶著同一個 sha 發第二次請求

const $rows = document.getElementById('rows');
const $status = document.getElementById('status');
const $save = document.getElementById('save');
const $add = document.getElementById('add');
const $bar = document.getElementById('bar');

/** 把 body 的留白量成 #bar 目前的實際高度（見上面 CSS 的 --bar-h 說明），
 *  不用猜的常數。用 ResizeObserver 而不是只在 load 時量一次，是因為換行
 *  這件事會在畫面生命週期中重新發生：手機窄螢幕按鈕擠成兩排、或狀態列
 *  文字變成比較長的錯誤訊息時，都會讓 #bar 變高，這時候也要跟著重量。 */
function syncBarHeight() {
  document.documentElement.style.setProperty('--bar-h', `${$bar.offsetHeight}px`);
}
syncBarHeight();
if (window.ResizeObserver) {
  new ResizeObserver(syncBarHeight).observe($bar);
} else {
  // 沒有 ResizeObserver 的舊瀏覽器：至少視窗尺寸改變（例如轉橫向）時重量一次。
  window.addEventListener('resize', syncBarHeight);
}

function setStatus(text, kind = '') {
  $status.textContent = text;
  $status.className = kind;
}

function markDirty() {
  dirty = true;
  editSeq += 1;
  // 存檔還在飛行中時不要動按鈕跟狀態列：重新啟用儲存鈕會讓使用者能在同一個
  // sha 還沒更新前又點一次儲存，送出第二個 PUT，自己把自己擠成 409。
  // editSeq 已經記到了，save() 回應回來時會自己判斷要不要顯示「未儲存」。
  if (saving) return;
  $save.disabled = false;
  setStatus('未儲存');
}

/** 每列一個穩定 id，刪掉中間某列時其他列不會錯位。
 *  用 Math.random() 不是防碰撞的做法（不是 crypto.randomUUID()）：真的撞號
 *  的話後果不只是「兩列看起來很像」——刪除鈕是用 rows.filter(c => c.id
 *  !== row.id) 找要留下的列，兩列共用同一個 id 會在按一次刪除時一起消失。
 *  但 Math.random().toString(36) 取 8 碼、約 40 bits 亂數空間，對一張表
 *  通常只有幾十列的規模，碰撞機率低到可以接受，換成真正的 UUID 對這個
 *  工具來說是過度設計。 */
function newId() {
  return Math.random().toString(36).slice(2, 10);
}

function autoGrow(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = `${textarea.scrollHeight}px`;
}

function render() {
  $rows.textContent = '';
  for (const row of rows) {
    const tr = document.createElement('tr');

    for (const field of FIELDS) {
      const td = document.createElement('td');
      td.dataset.label = LABELS[field];
      const textarea = document.createElement('textarea');
      textarea.value = row[field] || '';
      textarea.addEventListener('input', () => {
        row[field] = textarea.value;
        autoGrow(textarea);
        markDirty();
      });
      td.appendChild(textarea);
      tr.appendChild(td);
    }

    const tools = document.createElement('td');
    tools.className = 'row-tools';
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '刪除這一列';
    del.addEventListener('click', () => {
      if (!confirm('刪除這一列？')) return;
      rows = rows.filter((candidate) => candidate.id !== row.id);
      render();
      markDirty();
    });
    tools.appendChild(del);
    tr.appendChild(tools);

    $rows.appendChild(tr);
  }

  // 內容塞進 DOM 之後才量得到高度
  for (const textarea of $rows.querySelectorAll('textarea')) autoGrow(textarea);
}

async function load() {
  setStatus('載入中…');
  try {
    const response = await fetch('/api/table');
    const body = await response.json();
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);

    // id 一定要放在展開之後：舊資料若沒有 id，展開會用 undefined 蓋掉剛產生的 id
    rows = body.data.rows.map((row) => ({ ...row, id: row.id || newId() }));
    sha = body.sha;
    render();
    dirty = false;
    $save.disabled = true;
    // 「新增一列」在載入完成前一直是 disabled（見 HTML）。載入還沒回來時
    // 頁面上除了這顆按鈕沒有任何東西能讓使用者動手（表格是空的、也還沒有
    // textarea），所以只要在這裡才放行，就能保證不會有「使用者剛新增一列，
    // 結果緊接著 load() 回來把整包 rows 蓋掉」這種悄悄遺失輸入的情形。
    $add.disabled = false;
    setStatus(body.data.updated ? `已儲存 ${body.data.updated.slice(11, 16)}` : '尚無資料', 'saved');
  } catch (error) {
    // 載入失敗時不要顯示空表格，那會讓人以為資料不見了；「新增一列」也
    // 保持停用 —— 沒有成功載入就沒有可信的 sha 基準，這時候讓使用者新增
    // 列還是別開放，避免之後儲存踩到不確定的狀態。
    setStatus(`載入失敗：${error.message}`, 'error');
  }
}

async function save() {
  if (saving) return; // 已經有一個 PUT 在飛行中，不要再送第二個
  saving = true;
  $save.disabled = true;
  setStatus('儲存中…');
  // 在送出前拍下這一刻的編輯序號。JSON.stringify 在下面同步組好 body，
  // 之後（fetch 送出到回應回來這段時間，實測 0.5～2 秒）使用者若繼續打字，
  // rows 會被改動，但那些改動不在剛剛序列化好的 body 裡——回應回來時要
  // 比對 editSeq 有沒有變過，變過就不能宣稱「已儲存」。
  const seq = editSeq;
  try {
    const response = await fetch('/api/table', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: { v: 1, rows }, sha }),
    });
    const body = await response.json();

    if (response.status === 409) {
      // 衝突時絕不清空畫面 —— 使用者剛打的字必須留著
      setStatus(body.error, 'error');
      saving = false;
      $save.disabled = false;
      return;
    }
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);

    // sha 不論下面判斷結果如何都要更新：這次寫入確實已經送達 GitHub，
    // 下一次存檔要以這個新 sha 為基準，不然會拿舊 sha 去送，自己製造 409。
    sha = body.sha;
    saving = false;

    if (editSeq === seq) {
      // 送出後沒有人再動過任何欄位，這次回應涵蓋了畫面上的全部內容，
      // 這才是真的「已儲存」。
      dirty = false;
      $save.disabled = true;
      setStatus(`已儲存 ${body.updated.slice(11, 16)}`, 'saved');
    } else {
      // 飛行中使用者又打了字，那些內容沒被送出去，不能宣稱已儲存——
      // 否則 beforeunload 不會攔阻，使用者會誤以為新打的東西已經存好了。
      dirty = true;
      $save.disabled = false;
      setStatus('未儲存');
    }
  } catch (error) {
    setStatus(`儲存失敗：${error.message}`, 'error');
    saving = false;
    $save.disabled = false;
  }
}

$add.addEventListener('click', () => {
  rows.push({ id: newId(), progress: '', insights: '', npi: '', remarks: '' });
  render();
  markDirty();
});

$save.addEventListener('click', save);

window.addEventListener('beforeunload', (event) => {
  if (!dirty) return;
  event.preventDefault();
  event.returnValue = '';
});

load();
</script>
</body>
</html>
